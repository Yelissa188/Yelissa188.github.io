<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eee5d7" />
  <meta name="description" content="Solovled · An independent space for writing, conversations, research and creative experiments." />
  <title>Solovled · An Independent Space</title>
  <style>
    :root{color-scheme:light;--paper:#eee5d7;--ink:#352b24;--muted:#796a5a;--line:#cabbac}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 9% 1%,#f9f4ea,transparent 40%),var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
    .wrap{width:min(1100px,calc(100% - 48px));min-height:100vh;margin:auto;display:flex;flex-direction:column}
    header{border-bottom:1px solid var(--line);padding:30px 0;font:700 15px/1.3 Arial,Helvetica,sans-serif;letter-spacing:.24em}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;padding:100px 0}
    .eyebrow{font:11px/1.5 Arial,Helvetica,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    h1{font-size:clamp(50px,8vw,98px);font-weight:400;letter-spacing:-.065em;line-height:1.06;margin:25px 0 30px}
    p{font-size:19px;line-height:1.75;color:#65574a;max-width:560px;margin:0 0 30px}
    a{display:inline-block;align-self:start;text-decoration:none;font:12px/1.4 Arial,Helvetica,sans-serif;letter-spacing:.1em;border-bottom:1px solid var(--ink);padding-bottom:8px;color:var(--ink)}
    a:hover{color:#8f704f;border-color:#8f704f}
    a:focus-visible{outline:2px solid #8f704f;outline-offset:4px}
    footer{padding:26px 0 35px;border-top:1px solid var(--line);font:11px Arial,Helvetica,sans-serif;letter-spacing:.1em;color:var(--muted)}
    @media(max-width:560px){.wrap{width:min(100% - 36px,1100px)}main{padding:70px 0}p{font-size:17px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>SOLOVLED<span style="color:#ab8764">.</span></header>
    <main>
      <span class="eyebrow">A personal space, taking shape</span>
      <h1>Words, questions,<br>and everything in between.</h1>
      <p>An independent home for writing, conversations, research, and creative experiments. The full site is taking shape.</p>
      <a href="https://solovled188.substack.com/" target="_blank" rel="noopener noreferrer">READ THE WRITING ↗</a>
    </main>
    <footer>© SOLOVLED · INDEPENDENT THINKING</footer>
  </div>
</body>
</html>
