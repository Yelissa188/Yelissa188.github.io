name: Solovled Support — build check

on:
  push:
    branches:
      - feat/solovled-support-draft
    paths:
      - 'support-app/**'
      - '.github/workflows/solovled-support-check.yml'
  pull_request:
    paths:
      - 'support-app/**'
      - '.github/workflows/solovled-support-check.yml'

permissions:
  contents: read

jobs:
  validate-support-app:
    name: Vite + TypeScript build (no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Verify resulting files
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/support/assets/' dist/index.html
