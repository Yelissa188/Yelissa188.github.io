name: Solovled Support · build check
on:
  pull_request:
    paths:
      - 'support-app/**'
      - '.github/workflows/support-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: support-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build static site
        run: npm run build
      - name: Upload compiled preview
        uses: actions/upload-artifact@v4
        with:
          name: solovled-support-build
          path: support-app/dist/
